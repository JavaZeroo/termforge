# Opt-in single hosted Windows QPA run for the #324 multiline paste recovery.
# The default qt-cpp.yml lane keeps the historical single-line hosted scope; the
# multiline real-CF dialog branch only executes with TERMFORGE_QT_HOSTED_MULTILINE=1.
# Attempt 3 consumed the recovery quota on 2026-11-12 (run 43101420107 / job
# 130793595825, passed); the trigger is dispatch-only so later pushes of result
# docs or trace cleanups cannot re-execute the real hosted path.
name: Qt hosted Windows multiline paste recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-multiline-paste:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      TERMFORGE_QT_HOSTED_MULTILINE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify preparation failure contracts
        run: python -m unittest tools.test_prepare_qt_build tools.test_prepare_msvc_runtime tools.test_msvc_runtime -v
      - name: Prepare manifest-pinned Qt qtbase, Microsoft ConPTY and CRT
        run: python -m tools.prepare_qt_build
      - name: Configure explicit Qt product and test entries
        run: |
          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE 'local/qt-build-deps'
          cmake -S . -B build/qt-cpp -G 'Visual Studio 18 2026' -A x64 `
            -DTERMFORGE_BUILD_QT_SHELL=ON -DBUILD_TESTING=ON `
            -DTERMFORGE_BUILD_CANDIDATE_ADAPTER=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" `
            "-DQt6_DIR=$dependencyRoot/qt/lib/cmake/Qt6" `
            "-DTERMFORGE_CONPTY_BACKEND_DIR=$dependencyRoot/conpty" `
            "-DTERMFORGE_MSVC_RUNTIME_DIR=$dependencyRoot/crt"
      - name: Build Qt clipboard system test
        run: cmake --build build/qt-cpp --config Release --target qt_clipboard_system_test --parallel 2
      - name: Run hosted Windows QPA multiline paste recovery
        env:
          TERMFORGE_QT_QPA_PLATFORM: windows
        run: python src/qt/run_smoke.py build/qt-cpp/qt-clipboard-bin/Release/qt_clipboard_system_test.exe --hosted-windows-paste
