name: Qt native IME observer build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ime-build:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 5fe10a5c4cbd551122e19086be4b934ceae22856
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify preparation failure contracts
        run: python -m unittest tools.test_prepare_qt_build tools.test_prepare_msvc_runtime tools.test_msvc_runtime tools.test_stage_qt_product tools.test_build_qt_component_inventory -v
      - name: Prepare manifest-pinned Qt qtbase, Microsoft ConPTY and CRT
        run: python -m tools.prepare_qt_build
      - name: Verify deployed Qt component inventory against the pinned archive and SBOM
        run: |
          python -m tools.build_qt_component_inventory check `
            --cache local/qt-downloads `
            --sbom local/qt-build-deps/qt/sbom/qtbase-6.10.3.spdx.json `
            --sdk-dir local/qt-build-deps/qt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve path-free dependency preparation identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-cpp-dependency-preparation
          retention-days: 14
          if-no-files-found: warn
          path: local/qt-build-preparation.json
      - name: Configure explicit Qt product and test entries
        run: |
          $dependencyRoot = Join-Path $env:GITHUB_WORKSPACE 'local/qt-build-deps'
          # Select the runner's VS 2022 toolset supported by the fixed CRT.
          cmake -S . -B build/qt-cpp -G 'Visual Studio 18 2026' -A x64 -T v143 `
            -DTERMFORGE_BUILD_QT_SHELL=ON -DBUILD_TESTING=ON `
            -DTERMFORGE_BUILD_CANDIDATE_ADAPTER=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" `
            "-DQt6_DIR=$dependencyRoot/qt/lib/cmake/Qt6" `
            "-DTERMFORGE_CONPTY_BACKEND_DIR=$dependencyRoot/conpty" `
            "-DTERMFORGE_MSVC_RUNTIME_DIR=$dependencyRoot/crt"
      - name: Build the observer and stage project binaries
        run: |
          $source = git rev-parse HEAD
          if ($source -ne '5fe10a5c4cbd551122e19086be4b934ceae22856') { throw 'Frozen source differs' }
          cmake --build build/qt-cpp --config Release --target qt_native_ime_single_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = 'build/qt-cpp/qt-native-ime-bin/Release'
          $out = 'local/native-ime-observer-build'
          New-Item -ItemType Directory -Path $out | Out-Null
          $hashes = [ordered]@{}
          foreach ($name in @('qt_native_ime_single_test.exe','shell_input_client.exe')) {
            Copy-Item -LiteralPath "$dir/$name" -Destination $out
            $hashes[$name] = (Get-FileHash -LiteralPath "$out/$name").Hash.ToLowerInvariant()
          }
          [ordered]@{
            source = $source
            tree = (git rev-parse 'HEAD^{tree}')
            executable_sha256 = $hashes
            runner = $env:ImageVersion
          } | ConvertTo-Json -Depth 4 | Set-Content "$out/identity.json"
      - name: Archive project observer binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-native-ime-observer-build
          path: local/native-ime-observer-build/
          if-no-files-found: error
          retention-days: 5
