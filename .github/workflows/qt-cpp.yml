name: R29 native map and Win32 acceptance probes

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Verified upstream build run
        required: true
        type: string
      build_head:
        description: Exact upstream build workflow commit
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  native-runtime:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'codex/r29-map-runtime'
    runs-on: windows-2025
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        variant: [official, candidate]
    env:
      PYTHONUTF8: '1'
      TERMFORGE_QT_QPA_PLATFORM: offscreen
      VARIANT: ${{ matrix.variant }}
      BUILD_RUN: ${{ inputs.build_run }}
      BUILD_HEAD: ${{ inputs.build_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare official pinned dependencies
        run: python -m tools.prepare_qt_build
      - name: Configure and build normalized native observations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'tf29-native-runtime'
          New-Item -ItemType Directory -Path $out | Out-Null
          $deps = Join-Path $env:GITHUB_WORKSPACE 'local/qt-build-deps'
          $pair = "$deps/conpty"
          $artifact = $null
          if ($env:VARIANT -ne 'official') {
            $pair = "$deps/native-depth-pair"
            $line = python experiments/conpty/upstream/stage_r29_runtime.py --run $env:BUILD_RUN --build-head $env:BUILD_HEAD --variant $env:VARIANT --out $pair
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $artifact = $line | ConvertFrom-Json
          }
          $hashes = [ordered]@{}
          foreach ($file in @('conpty.dll', 'OpenConsole.exe')) {
            $hashes[$file] = (Get-FileHash -LiteralPath "$pair/$file").Hash.ToLowerInvariant()
          }
          [ordered]@{variant=$env:VARIANT; files=$hashes; source=$(git rev-parse HEAD);
            variant_build_run=$env:BUILD_RUN; variant_build_head=$env:BUILD_HEAD; pair_artifact=$artifact;
            runner_image=$env:ImageVersion; workflow_run=$env:GITHUB_RUN_ID
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$out/identity.json" -Encoding UTF8
          cmake -S . -B build/qt-cpp -G 'Visual Studio 18 2026' -A x64 -T v143 `
            -DTERMFORGE_BUILD_QT_SHELL=ON -DBUILD_TESTING=ON `
            -DTERMFORGE_BUILD_CANDIDATE_ADAPTER=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" `
            "-DQt6_DIR=$deps/qt/lib/cmake/Qt6" `
            "-DTERMFORGE_CONPTY_BACKEND_DIR=$pair" `
            "-DTERMFORGE_MSVC_RUNTIME_DIR=$deps/crt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/qt-cpp --config Release --target qt_terminal_modes_test qt_cpp_resize_smoke qt_cpp_shell_smoke qt_unicode_input_test qt_unicode_render_test qt_eight_session_test qt_hidden_retention_test qt_history_navigation_test qt_selection_migration_test qt_find_test qt_scrollbar_size_test qt_autoscroll_test qt_query_reply_test qt_paste_test --parallel 2
      - name: Run the original resize, Win32 I/O and ordered host map
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'tf29-native-runtime'
          $modes = 'build/qt-cpp/qt-modes-bin/Release/qt_terminal_modes_test.exe'
          $resize = Get-ChildItem -LiteralPath 'build/qt-cpp' -Recurse -File -Filter 'qt_cpp_resize_smoke.exe' | Select-Object -ExpandProperty FullName
          if (@($resize).Count -ne 1) { throw 'Win32 test executable not uniquely found' }
          $identity = Get-Content -Raw -LiteralPath "$out/identity.json" | ConvertFrom-Json -AsHashtable
          $identity.executable_sha256 = (Get-FileHash -LiteralPath $modes).Hash.ToLowerInvariant()
          $identity.win32_executable_sha256 = (Get-FileHash -LiteralPath $resize).Hash.ToLowerInvariant()
          $identity | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$out/identity.json" -Encoding UTF8
          $scenarios = [ordered]@{ 'resize' = $modes; 'win32-compat' = $resize }
          if ($env:VARIANT -eq 'candidate') {
            $scenarios['native-resize-map'] = $modes
            $scenarios['bcd-comparison'] = $modes
          }
          $codes = [ordered]@{}
          foreach ($case in $scenarios.GetEnumerator()) {
            $scenario = $case.Key
            python src/qt/run_smoke.py $case.Value "--$scenario" *> "$out/$scenario.log"
            $codes[$scenario] = $LASTEXITCODE
            $records = @(Get-Content -LiteralPath "$out/$scenario.log" | ForEach-Object {
              try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {}
            } | Where-Object { $_.schema -like 'termforge-qt-*' })
            ConvertTo-Json -InputObject $records -Depth 22 | Set-Content -LiteralPath "$out/$scenario.json" -Encoding UTF8
            Get-Content -LiteralPath "$out/$scenario.log"
          }
          $codes | ConvertTo-Json | Set-Content -LiteralPath "$out/exit-codes.json" -Encoding UTF8
          if ($codes['win32-compat'] -ne 0 -or ($env:VARIANT -eq 'candidate' -and
            ($codes['native-resize-map'] -ne 0 -or $codes['resize'] -ne 0))) { exit 1 }
          exit 0
      - name: Run the retained text, resize and Qt interaction matrix
        if: always()
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'tf29-native-runtime'
          ctest --test-dir build/qt-cpp -C Release -R '^(qt_cpp_(shell|resize)|qt_unicode_input|qt_unicode_render|qt_eight_session|qt_terminal_modes(_retained)?|qt_hidden_retention|qt_history_navigation|qt_selection_migration|qt_find|qt_scrollbar_size|qt_autoscroll|qt_query_reply|qt_paste)$' --no-tests=error --output-on-failure --output-junit "$out/qt-junit.xml"
      - name: Preserve frozen synthetic runtime observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r29-native-map-runtime-${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/tf29-native-runtime/*.json
            ${{ runner.temp }}/tf29-native-runtime/*.xml
