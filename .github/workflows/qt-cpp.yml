name: Qt autoscroll literal compile only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-v2:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref_name == 'codex/r29-autoscroll-literal-compile'
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      FROZEN_SOURCE: cf5fd1dac63d5fb911de11839c6be1e84f20f744
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cf5fd1dac63d5fb911de11839c6be1e84f20f744
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare manifest-pinned Qt, ConPTY and CRT
        run: python -m tools.prepare_qt_build
      - name: Configure and build the literal target
        run: |
          $deps = Join-Path $env:GITHUB_WORKSPACE 'local/qt-build-deps'
          cmake -S . -B build/qt-cpp -G 'Visual Studio 18 2026' -A x64 -T v143 `
            -DTERMFORGE_BUILD_QT_SHELL=ON -DBUILD_TESTING=ON `
            -DTERMFORGE_BUILD_CANDIDATE_ADAPTER=OFF `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)" `
            "-DQt6_DIR=$deps/qt/lib/cmake/Qt6" `
            "-DTERMFORGE_CONPTY_BACKEND_DIR=$deps/conpty" `
            "-DTERMFORGE_MSVC_RUNTIME_DIR=$deps/crt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/qt-cpp --config Release --target qt_autoscroll_literal_test --parallel 2
