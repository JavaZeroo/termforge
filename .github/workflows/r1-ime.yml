name: R1 hosted IME inventory and verification

# Disposable VM only. Preparation or observation failures remain failed gates.
on:
  # Pushes collect facts only; activation/input requires explicit verify mode.
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-ime.yml'
      - 'research/ime/inventory_hosted.py'
      - 'research/ime/inventory_worker.ps1'
      - 'research/ime/test_hosted_inventory.py'
      - 'research/ime/prepare_hosted.ps1'
      - 'research/ime/test_prepare_hosted.py'
      - 'experiments/conpty/run.py'
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inventory, or explicit preparation and real IME verification
        type: choice
        required: true
        default: inventory
        options:
          - inventory
          - verify

permissions:
  contents: read

jobs:
  real-ime:
    if: github.repository == 'JavaZeroo/termforge'
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check inventory guard, evidence and owned synthetic timeout
        timeout-minutes: 2
        run: python -m unittest research.ime.test_hosted_inventory research.ime.test_prepare_hosted research.ime.test_product_ime -v
      - name: Read-only bounded hosted IME inventory
        timeout-minutes: 4
        run: python -m research.ime.inventory_hosted --out local/hosted-ime/inventory --query-timeout 60
      - name: Configure probe
        if: inputs.mode == 'verify'
        timeout-minutes: 3
        run: cmake -S . -B build -DBUILD_TESTING=OFF
      - name: Build native IME probe and product receiver
        if: inputs.mode == 'verify'
        timeout-minutes: 5
        run: cmake --build build --config Release --target termforge_ime_probe shell_test_launcher shell_ime_client --parallel 2
      - name: Activate existing fixed Microsoft Pinyin in disposable hosted VM
        if: inputs.mode == 'verify'
        timeout-minutes: 10
        run: >-
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe"
          -NoProfile -NonInteractive -ExecutionPolicy Bypass
          -File ./research/ime/prepare_hosted.ps1
          -Out "$env:GITHUB_WORKSPACE/local/hosted-ime/environment"
      - name: Require real composition, candidate position, commit and cancel
        if: inputs.mode == 'verify'
        timeout-minutes: 2
        run: >-
          python research/ime/run_probe.py
          --exe build/bin/Release/termforge_ime_probe.exe
          --mode hosted --timeout 55 --out local/hosted-ime/probe
      - name: Require four real product IME workflows and owned cleanup
        if: inputs.mode == 'verify'
        timeout-minutes: 5
        run: >-
          python -m research.ime.product_runner
          --launcher build/bin/Release/shell_test_launcher.exe
          --timeout 60 --out local/hosted-ime/product
      - name: Preserve bounded IME evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r1-ime-windows-2025
          retention-days: 14
          if-no-files-found: warn
          path: |
            local/hosted-ime/inventory/inventory.json
            local/hosted-ime/inventory/*/phase.json
            local/hosted-ime/inventory/*/progress.json
            local/hosted-ime/environment/environment.json
            local/hosted-ime/probe/result.json
            local/hosted-ime/probe/stdout.jsonl
            local/hosted-ime/probe/stderr.txt
            local/hosted-ime/product/manifest.json
            local/hosted-ime/product/*/result.json
            local/hosted-ime/product/*/product-ime.json
            local/hosted-ime/product/*/progress.jsonl
            local/hosted-ime/product/*/stdout.jsonl
            local/hosted-ime/product/*/stderr.txt
            local/hosted-ime/product/*/frame.bmp
            local/hosted-ime/product/*/bottom.bin
            local/hosted-ime/product/*/main.bin
            local/hosted-ime/product/*/hidden.bin
