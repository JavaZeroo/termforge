name: R1 official reference behavior

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r1-reference.yml'
      - 'research/ui/r1_*.py'
      - 'research/ui/r1_*.js'
      - 'research/ui/qt_r1_text.js'
      - 'research/ui/r1-tools/package*.json'
      - 'research/tests/test_ui_r1.py'
      - 'research/ui/test_r1_action_context.py'

permissions:
  contents: read

jobs:
  official-reference:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
      - name: Prepare pinned official release and locked REA tool
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path local/r1-public -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/kingToolbox/WindTerm/releases/download/2.7.0/WindTerm_2.7.0_Windows_Portable_x86_64.zip' -OutFile local/WindTerm-2.7.0.zip
          python benchmarks/tools/prepare_windterm.py local/WindTerm-2.7.0.zip --out local/windterm-official
          if ($LASTEXITCODE) { throw 'Pinned package verification failed' }
          npm ci --prefix research/ui/r1-tools --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Locked REA install failed' }
          python -m unittest research.tests.test_ui_r1 research.ui.test_r1_action_context -v
          if ($LASTEXITCODE) { throw 'Evidence boundary checks failed' }
      - name: Observe two fresh profiles serially on the disposable VM
        shell: pwsh
        run: |
          $probeFailed = $false
          foreach ($runIndex in 1, 2) {
            $runName = 'r1-hosted-{0:d2}' -f $runIndex
            $runDirectory = "local/ui-reference/$runName"
            python research/ui/r1_launch.py --source local/windterm-official/WindTerm_2.7.0 --out $runDirectory --rea research/ui/r1-tools/node_modules/.bin/rea.cmd --hosted-ci --seconds 45
            if ($LASTEXITCODE) { $probeFailed = $true }
            $compareArgs = @()
            if ($runIndex -eq 2) { $compareArgs = @('--compare-with', 'local/r1-public/r1-hosted-01-summary.json') }
            python research/ui/r1_summarize.py $runDirectory --out "local/r1-public/$runName-summary.json" --require-complete @compareArgs
            if ($LASTEXITCODE) { $probeFailed = $true }
          }
          if ($probeFailed) { throw 'Reference evidence remains incomplete; inspect allowlisted diagnostics' }
      - name: Observe raw VT wraps and actual menu actions in two fresh profiles
        if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        shell: pwsh
        run: |
          $probeFailed = $false
          foreach ($runIndex in 1, 2) {
            $runName = 'r1-menu-hosted-{0:d2}' -f $runIndex
            $runDirectory = "local/ui-reference/$runName"
            python research/ui/r1_launch.py --source local/windterm-official/WindTerm_2.7.0 --out $runDirectory --rea research/ui/r1-tools/node_modules/.bin/rea.cmd --scenario menu-wrap --hosted-ci --seconds 45
            if ($LASTEXITCODE) { $probeFailed = $true }
            $compareArgs = @()
            if ($runIndex -eq 2) { $compareArgs = @('--compare-with', 'local/r1-public/r1-menu-hosted-01-summary.json') }
            python research/ui/r1_summarize.py $runDirectory --out "local/r1-public/$runName-summary.json" --require-menu-complete @compareArgs
            if ($LASTEXITCODE) { $probeFailed = $true }
          }
          if ($probeFailed) { throw 'Raw VT or menu evidence remains incomplete; inspect allowlisted diagnostics' }
      - name: Observe action ownership and actual PasteDialog Return twice
        if: ${{ !cancelled() && steps.prepare.conclusion == 'success' }}
        shell: pwsh
        run: |
          $probeFailed = $false
          foreach ($runIndex in 1, 2) {
            $runName = 'r1-context-hosted-{0:d2}' -f $runIndex
            $runDirectory = "local/ui-reference/$runName"
            python research/ui/r1_launch.py --source local/windterm-official/WindTerm_2.7.0 --out $runDirectory --rea research/ui/r1-tools/node_modules/.bin/rea.cmd --scenario action-context --hosted-ci --seconds 45
            if ($LASTEXITCODE) { $probeFailed = $true }
            $compareArgs = @()
            if ($runIndex -eq 2) { $compareArgs = @('--compare-with', 'local/r1-public/r1-context-hosted-01-summary.json') }
            python research/ui/r1_summarize.py $runDirectory --out "local/r1-public/$runName-summary.json" --require-context-complete @compareArgs
            if ($LASTEXITCODE) { $probeFailed = $true }
            python research/ui/r1_summarize.py $runDirectory --out "local/r1-public/$runName-ordered-evidence.json" --export-context
            if ($LASTEXITCODE) { $probeFailed = $true }
          }
          if ($probeFailed) { throw 'Action context evidence remains incomplete; inspect allowlisted diagnostics' }
      - name: Produce allowlisted diagnostics only
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path local/r1-public -Force | Out-Null
          foreach ($prefix in 'r1-hosted', 'r1-menu-hosted', 'r1-context-hosted') {
            foreach ($runIndex in 1, 2) {
              $runName = '{0}-{1:d2}' -f $prefix, $runIndex
              python research/ui/r1_summarize.py "local/ui-reference/$runName" --out "local/r1-public/$runName-diagnostic.json" --diagnostic-only
            }
          }
      - name: Preserve original fact summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r1-reference-facts
          retention-days: 14
          if-no-files-found: warn
          path: local/r1-public/*.json
