name: R1 official reference behavior

on:
  workflow_dispatch:
  push:
    branches: [codex/r28-bracketed-clipboard-reference]
    paths:
      - '.github/workflows/r1-reference.yml'
      - 'research/ui/r1_*.py'
      - 'research/ui/r1_*.js'
      - 'research/ui/qt_r1_text.js'
      - 'research/ui/r1-tools/package*.json'
      - 'research/tests/test_ui_r1.py'
      - 'research/ui/test_r1_action_context.py'

permissions:
  contents: read

jobs:
  official-reference:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.21.1'
      - name: Prepare pinned official release and locked REA tool
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path local/r1-public -Force | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/kingToolbox/WindTerm/releases/download/2.7.0/WindTerm_2.7.0_Windows_Portable_x86_64.zip' -OutFile local/WindTerm-2.7.0.zip
          python benchmarks/tools/prepare_windterm.py local/WindTerm-2.7.0.zip --out local/windterm-official
          if ($LASTEXITCODE) { throw 'Pinned package verification failed' }
          npm ci --prefix research/ui/r1-tools --no-audit --no-fund
          if ($LASTEXITCODE) { throw 'Locked REA install failed' }
          python -m unittest research.tests.test_ui_r1 research.ui.test_r1_action_context -v
          if ($LASTEXITCODE) { throw 'Evidence boundary checks failed' }
      - name: Observe clipboard paste in default, enabled and disabled modes
        run: |
          $env:R28_BRACKETED_REFERENCE = "1"
          foreach ($i in 1,2) {
            $out = "local/ui-reference/bracketed-$i"
            python research/ui/r1_launch.py --source local/windterm-official/WindTerm_2.7.0 --out $out --rea research/ui/r1-tools/node_modules/.bin/rea.cmd --scenario menu-wrap --hosted-ci --seconds 35
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $peer = Get-Content "$out/peer.json" -Raw | ConvertFrom-Json
            $identity = Get-Content "$out/run.json" -Raw | ConvertFrom-Json
            $identity | Select-Object sha256,files_sha256,clipboard | ConvertTo-Json -Compress
            $peer | Select-Object columns,rows,received_hex,completed | ConvertTo-Json -Compress
            $record = Get-Content "$out/evidence.json" -Raw | ConvertFrom-Json
            $confirmed = [regex]::Matches(($record | ConvertTo-Json -Depth 50 -Compress), '"kind":"paste_confirmed","phase":(\d+)') | ForEach-Object { $_.Groups[1].Value }
            Write-Output ("PasteDialog confirmed in phases [{0}]" -f ($confirmed -join ','))
            if ($peer.completed -ne 6) { throw "Incomplete paste observation" }
          }
