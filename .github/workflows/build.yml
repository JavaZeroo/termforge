name: Build and synthetic regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            bin_dir: build/bin/Release
          - os: ubuntu-24.04
            bin_dir: build/bin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      TERMFORGE_BIN_DIR: ${{ github.workspace }}/${{ matrix.bin_dir }}
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install --require-hashes -r experiments/differential/requirements.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Bind clipboard diagnostic binaries
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/diagnose/clipboard-stages-r99'
        shell: pwsh
        run: |
          # [DEBUG-r99] Hash only this clean build's fixed synthetic entry points.
          $diagnosticFiles = @{}
          foreach ($diagnosticName in @('termforge_shell.exe', 'shell_test_launcher.exe', 'shell_clipboard_reader.exe', 'shell_input_client.exe')) {
            $diagnosticPath = Join-Path 'build/bin/Release' $diagnosticName
            $diagnosticFiles[$diagnosticName] = @{
              sha256 = (Get-FileHash -LiteralPath $diagnosticPath -Algorithm SHA256).Hash.ToLowerInvariant()
              bytes = (Get-Item -LiteralPath $diagnosticPath).Length
            }
          }
          $diagnosticSource = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'diagnostic source identity failed' }
          New-Item -ItemType Directory -Force -Path 'build/test-artifacts/shell' | Out-Null
          @{
            schema = 'termforge-clipboard-stage-build-r99-v1'
            source = $diagnosticSource
            files = $diagnosticFiles
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath 'build/test-artifacts/shell/clipboard-stage-build.json' -Encoding utf8
      - name: Verify shell preparation guards and oracles
        run: python -m unittest tools.test_prepare_hosted_shells tools.test_owned_job_cleanup -v
      - name: Prepare hosted Windows shell prerequisites
        if: runner.os == 'Windows'
        run: python -m tools.prepare_hosted_shells --out local/hosted-shells
      - name: Preserve sanitized shell preparation result
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-shell-preparation
          retention-days: 14
          if-no-files-found: warn
          path: local/hosted-shells/summary.json
      - name: Test
        env:
          TERMFORGE_REQUIRE_SYSTEM_CLIPBOARD: ${{ runner.os == 'Windows' && '1' || '0' }}
          # [DEBUG-r99] One diagnostic branch's original push/default gate.
          TERMFORGE_R99_STAGE_TRACE: ${{ runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/diagnose/clipboard-stages-r99' && '1' || '0' }}
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Preserve clipboard and window integration evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r1-windows-input
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/test-artifacts/paste/
            build/test-artifacts/shell/
            build/test-artifacts/selection-bytes/
            build/test-artifacts/selection-context/
            build/test-artifacts/text-actions/
            build/test-artifacts/raw-console-receiver/
            build/test-artifacts/conpty-ctrl-c/run-*/**/sample.json
            build/test-artifacts/workflow-fixture/run-*/validation.json
            build/test-artifacts/workflow-fixture/run-*/stdout.json
            build/test-artifacts/workflow-fixture/run-*/cases/*/capture.bin
            build/test-artifacts/workflow-fixture/run-*/cases/*/capture.bin.source.bin
            build/test-artifacts/workflow-fixture/run-*/cases/*/capture.bin.workflow.json
            build/test-artifacts/workflow-fixture/run-*/cases/*/capture.bin.receiver.json
            build/test-artifacts/workflow-fixture/run-*/cases/*/capture.bin.progress.jsonl
            build/test-artifacts/workflow-controller/run-*/validation.json
            build/test-artifacts/workflow-controller/run-*/cases/*/capture.bin
            build/test-artifacts/workflow-controller/run-*/cases/*/capture.bin.source.bin
            build/test-artifacts/workflow-controller/run-*/cases/*/capture.bin.workflow.json
            build/test-artifacts/workflow-controller/run-*/cases/*/capture.bin.receiver.json
            build/test-artifacts/workflow-controller/run-*/cases/*/capture.bin.progress.jsonl
            build/test-artifacts/workflow-sessions/run-*/validation.json
            build/test-artifacts/workflow-sessions/run-*/sample.public.json
            build/test-artifacts/workflow-sessions/run-*/sessions.json
            build/test-artifacts/workflow-sessions/run-*/resource-phases.jsonl
            build/test-artifacts/workflow-sessions/run-*/resource-observations.jsonl
            build/test-artifacts/workflow-sessions/run-*/resource-summary.json
            build/test-artifacts/workflow-sessions/run-*/frame.bmp
            build/test-artifacts/workflow-sessions/run-*/cancel.bin
            build/test-artifacts/workflow-sessions/run-*/close.bin
            build/test-artifacts/workflow-sessions/run-*/fixtures/*/capture.bin
            build/test-artifacts/workflow-sessions/run-*/fixtures/*/capture.bin.source.bin
            build/test-artifacts/workflow-sessions/run-*/fixtures/*/capture.bin.workflow.json
            build/test-artifacts/workflow-sessions/run-*/fixtures/*/capture.bin.receiver.json
            build/test-artifacts/workflow-sessions/run-*/fixtures/*/capture.bin.progress.jsonl
            !build/test-artifacts/**/_private/**
      - name: Full ASCII state replay
        run: python -m experiments.core.run --out build/test-artifacts/replay-ascii
      - name: Full Unicode state replay
        run: python -m experiments.core.run --fixture unicode --out build/test-artifacts/replay-unicode
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/Testing/Temporary/
            build/test-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/test-artifacts/
            !build/test-artifacts/workflow-fixture/**/transport.bin
            !build/test-artifacts/workflow-fixture/**/*.identity
            !build/test-artifacts/workflow-fixture/**/stderr.txt
            !build/test-artifacts/workflow-controller/**/transport.bin
            !build/test-artifacts/workflow-controller/**/*.identity
            !build/test-artifacts/workflow-controller/**/stderr.txt
            !build/test-artifacts/workflow-controller/**/stdout.private.json
            !build/test-artifacts/workflow-sessions/**/*.identity
            !build/test-artifacts/workflow-sessions/**/sample.json
            !build/test-artifacts/**/_resources-private/**
            !build/test-artifacts/**/_private/**
