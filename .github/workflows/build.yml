name: Build and synthetic regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bin_dir: build/bin/Release
          - os: windows-2025
            bin_dir: build/bin/Release
          - os: ubuntu-24.04
            bin_dir: build/bin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      TERMFORGE_BIN_DIR: ${{ github.workspace }}/${{ matrix.bin_dir }}
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r benchmarks/requirements.txt
          python -m pip install --require-hashes -r experiments/differential/requirements.txt
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --output-junit test-results.xml
      - name: Full ASCII state replay
        run: python -m experiments.core.run --out build/test-artifacts/replay-ascii
      - name: Full Unicode state replay
        run: python -m experiments.core.run --fixture unicode --out build/test-artifacts/replay-unicode
      - name: Preserve synthetic failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/Testing/Temporary/
            build/test-results.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/test-artifacts/
