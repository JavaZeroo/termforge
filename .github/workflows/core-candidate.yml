name: External core candidate

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'experiments/core/**'
      - 'experiments/differential/**'
      - 'experiments/candidates/alacritty/**'
      - '.github/workflows/core-candidate.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'experiments/core/**'
      - 'experiments/differential/**'
      - 'experiments/candidates/alacritty/**'
      - '.github/workflows/core-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alacritty-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            binary: experiments/candidates/alacritty/target/release/termforge-alacritty-trace.exe
            core_binary: build/bin/Release/terminal_trace.exe
          - os: ubuntu-24.04
            binary: experiments/candidates/alacritty/target/release/termforge-alacritty-trace
            core_binary: build/bin/terminal_trace
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      TERMFORGE_ALACRITTY_TRACE: ${{ github.workspace }}/${{ matrix.binary }}
      TERMFORGE_TRACE: ${{ github.workspace }}/${{ matrix.core_binary }}
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install fixed semantic references
        run: python -m pip install --require-hashes -r experiments/differential/requirements.txt
      - name: Select fixed Rust toolchain
        run: rustup default 1.92.0
      - name: Build locked candidate
        working-directory: experiments/candidates/alacritty
        run: cargo build --release --locked
      - name: Test Rust projection
        working-directory: experiments/candidates/alacritty
        run: cargo test --locked
      - name: Build candidate measurement
        working-directory: experiments/candidates/alacritty
        run: cargo build --release --locked --bin alacritty-measure
      - name: Configure native trace on Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64
      - name: Configure native trace on Unix
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build native trace
        run: cmake --build build --config Release --target terminal_trace
      - name: Build native measurement
        run: cmake --build build --config Release --target core_measure
      - name: Build real application capture on Windows
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target real_app_capture
      - name: Run headless integration checks
        run: python experiments/candidates/alacritty/run.py --out build/test-artifacts/candidate-alacritty-cli
      - name: Test runner and failure gates
        run: python -m unittest experiments.candidates.alacritty.test_candidate -v
      - name: Compare common native traces
        run: python experiments/differential/compare_candidate.py --out build/test-artifacts/candidate-common
      - name: Test common comparison and failure gates
        run: python -m unittest discover -s experiments/differential -p test_candidate_compare.py -v
      - name: Compare extended capability traces
        run: python experiments/differential/capability_matrix.py --trace "${{ env.TERMFORGE_TRACE }}" --candidate "${{ env.TERMFORGE_ALACRITTY_TRACE }}" --out build/test-artifacts/candidate-capabilities-cli
      - name: Test extended capabilities and unsupported gates
        run: python -m unittest discover -s experiments/differential -p test_capability_matrix.py -v
      - name: Compare real application traces on Windows
        if: runner.os == 'Windows'
        run: python experiments/differential/real_app_matrix.py --trace "${{ env.TERMFORGE_TRACE }}" --candidate "${{ env.TERMFORGE_ALACRITTY_TRACE }}" --capture "${{ github.workspace }}/build/bin/Release/real_app_capture.exe" --out build/test-artifacts/real-app-cli
      - name: Test real application traces on Windows
        if: runner.os == 'Windows'
        run: python -m unittest discover -s experiments/differential -p test_real_app_matrix.py -v
      - name: Run bounded recovery fuzz
        run: python experiments/differential/fuzz_matrix.py --trace "${{ env.TERMFORGE_TRACE }}" --candidate "${{ env.TERMFORGE_ALACRITTY_TRACE }}" --out build/test-artifacts/candidate-fuzz-cli --seeds 4
      - name: Test fuzz minimization and fixed regressions
        run: python -m unittest discover -s experiments/differential -p test_fuzz_matrix.py -v
      - name: Compare interleaved project costs
        run: python experiments/measure/compare.py --out build/test-artifacts/measure-compare --cpu-seconds 1 --repeats 2
      - name: Test measurement contracts
        run: python -m unittest discover -s experiments/measure -p test_*.py -v
      - name: Preserve synthetic candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-alacritty-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/test-artifacts/candidate-alacritty-cli/
            build/test-artifacts/candidate-alacritty/
            build/test-artifacts/candidate-common/
            build/test-artifacts/candidate-comparison/
            build/test-artifacts/candidate-capabilities-cli/
            build/test-artifacts/candidate-capabilities/
            build/test-artifacts/real-app-cli/
            build/test-artifacts/real-applications/
            build/test-artifacts/candidate-fuzz-cli/
            build/test-artifacts/candidate-fuzz/
            build/test-artifacts/measure-compare/
