name: ConPTY legacy compatibility probe (known failing)

# This platform has a recorded resource regression; it is not a supported gate.
# Keep a fully automatic, strictly failing reproduction available for follow-up.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-2022-conpty:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build
      - name: Build controlled probe
        run: cmake --build build --config Release --target termforge_conpty_probe --parallel 2
      - name: Strict ConPTY lifecycle checks
        run: ctest --test-dir build -C Release -R "^conpty$" --output-on-failure --output-junit conpty-results.xml
      - name: Preserve synthetic reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conpty-windows-2022
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/Testing/Temporary/
            build/conpty-results.xml
            build/test-artifacts/conpty/

  windows-2025-resize-reply:
    # Bounded diagnostic for #145: the stale resize reply was observed on
    # windows-2025 in build.yml. This job repeats resize + client size query on
    # that host and keeps the raw per-round evidence. It asserts only structural
    # integrity; a stale count is reported in the artifact, not used as a gate.
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build
      - name: Build resize-reply diagnostic
        run: cmake --build build --config Release --target conpty_resize_reply_probe --parallel 2
      - name: Sample resize replies across fresh sessions
        shell: pwsh
        run: |
          $binary = "build/bin/Release/conpty_resize_reply_probe.exe"
          foreach ($iteration in 1..5) {
            python -m experiments.conpty.resize_reply_run --binary $binary --rounds 200 --mode raw --out "build/r145-session-$iteration"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -m experiments.conpty.resize_reply_run --binary $binary --rounds 100 --mode startup --out "build/r145-startup-$iteration"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Preserve resize-reply evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conpty-resize-reply-r145
          retention-days: 14
          if-no-files-found: warn
          path: build/r145-*

  windows-2025-original-probe-repeat:
    # #145 second slice: repeat the *original* lifecycle sample on the hosted
    # image that produced the stale reply. Each iteration keeps its own result;
    # a red sample carries the probe's native failure diagnostics.
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build
      - name: Build lifecycle probe
        run: cmake --build build --config Release --target termforge_conpty_probe --parallel 2
      - name: Repeat the recorded lifecycle sample
        shell: pwsh
        run: |
          $binary = Get-ChildItem build -Recurse -Filter termforge_conpty_probe.exe | Select-Object -First 1
          if (-not $binary) { throw "lifecycle probe binary missing" }
          python -m experiments.conpty.repeat_run --binary $binary.FullName --iterations 40 --repeats 3 --mode normal --out build/r145-repeat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve repeat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conpty-probe-repeat-r145
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/r145-repeat
            build/test-artifacts/conpty

  windows-2025-probe-after-conpty-tests:
    # #145: the recorded failure happened inside build.yml's long ctest job, not
    # in an isolated probe job. This job runs the console-heavy ConPTY tests
    # first (their exit is recorded, not gated), then samples the original probe.
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: ${{ github.workspace }}
      TERMFORGE_TEST_ARTIFACTS: ${{ github.workspace }}/build/test-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Build the console-heavy fixtures
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target termforge_conpty_probe conpty_ctrl_c_probe conpty_margin_probe --parallel 2
      - name: Run the console-heavy tests first
        shell: pwsh
        run: |
          ctest --test-dir build -C Release -R "^(conpty_ctrl_c|conpty_margin)$" --output-on-failure
          Write-Output "predecessor_exit=$LASTEXITCODE"
          exit 0
      - name: Sample the original probe after the predecessors
        shell: pwsh
        run: |
          $binary = Get-ChildItem build -Recurse -Filter termforge_conpty_probe.exe | Select-Object -First 1
          if (-not $binary) { throw "lifecycle probe binary missing" }
          python -m experiments.conpty.repeat_run --binary $binary.FullName --iterations 20 --repeats 3 --mode normal --out build/r145-after-conpty
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve post-predecessor evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conpty-probe-after-tests-r145
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/r145-after-conpty
            build/test-artifacts

  windows-2025-node-contract-timing:
    # Bounded diagnostic for #144: the raster style reference test times out at a
    # fixed 10s on the pure Node fixture. This job only measures the exact
    # command, sequentially and under a small concurrent load.
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Time the node contract fixture
        shell: pwsh
        run: |
          @'
          import json, platform, subprocess, sys, time
          from concurrent.futures import ThreadPoolExecutor
          script = "research/ui/test_raster_native_contract.js"
          node = subprocess.run(["node", "--version"], capture_output=True, text=True)
          def one():
              start = time.monotonic()
              try:
                  result = subprocess.run(["node", script], capture_output=True, text=True, timeout=10)
                  elapsed = time.monotonic() - start
                  return {"elapsed": round(elapsed, 3), "returncode": result.returncode, "timeout": False}
              except subprocess.TimeoutExpired:
                  return {"elapsed": round(time.monotonic() - start, 3), "returncode": None, "timeout": True}
          sequential = [one() for _ in range(60)]
          with ThreadPoolExecutor(max_workers=4) as pool:
              concurrent = [list(pool.map(lambda _: one(), range(4))) for _ in range(20)]
          report = {
              "schema": "termforge-node-contract-timing-v1",
              "issue": 144,
              "platform": platform.platform(),
              "node_version": node.stdout.strip() or node.stderr.strip(),
              "sequential": sequential,
              "sequential_timeouts": sum(1 for row in sequential if row["timeout"]),
              "concurrent": concurrent,
              "concurrent_timeouts": sum(1 for batch in concurrent for row in batch if row["timeout"]),
              "max_sequential": max(row["elapsed"] for row in sequential),
              "max_concurrent": max(row["elapsed"] for batch in concurrent for row in batch),
          }
          print(json.dumps(report))
          with open("node-contract-timing.json", "w", encoding="utf-8") as stream:
              json.dump(report, stream, indent=2)
          sys.exit(1 if report["sequential_timeouts"] or report["concurrent_timeouts"] else 0)
          '@ | Out-File -Encoding utf8 node-contract-timing.py
          python node-contract-timing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-contract-timing-r144
          retention-days: 14
          if-no-files-found: warn
          path: node-contract-timing.json

  windows-2025-actions-repeat:
    # Bounded reproduction for #99 / #73 / #97 and the clipboard/geometry
    # scenarios: repeats the actions, selection and full shell suites on the
    # hosted image so failure shapes can be ordered against the diagnostics.
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Prepare hosted Windows shell prerequisites
        run: python -m tools.prepare_hosted_shells --out local/hosted-shells
      - name: Repeat the actions scenarios
        env:
          TERMFORGE_REQUIRE_SYSTEM_CLIPBOARD: '1'
        run: ctest --test-dir build -C Release -R "text_actions|selection_context|shell" --repeat until-fail:3 --output-on-failure
      - name: Preserve repeat evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: actions-repeat-evidence
          retention-days: 14
          if-no-files-found: warn
          path: build/test-artifacts/
