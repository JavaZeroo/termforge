[package]
name = "termforge-alacritty-trace"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["vendor/alacritty_terminal"]

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "alacritty-measure"
path = "src/measure.rs"

[lib]
name = "termforge_alacritty_core"
path = "src/ffi.rs"
crate-type = ["staticlib"]
